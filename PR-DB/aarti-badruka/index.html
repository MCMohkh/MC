<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Aarti Badruka's Circle — MC</title>
  <link rel="icon" type="image/png" sizes="512x512" href="https://www.mcjoint.in/favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0b0b;color:#f5f4f1}
    body{font-family:Inter,Arial,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .card{width:min(680px,100%);text-align:center;padding:58px 34px;border:1px solid #292929;border-radius:10px;background:#151515}
    .logo{display:inline-flex;background:#fff;border-radius:4px;padding:7px 13px;margin-bottom:30px}
    .logo img{height:18px;width:auto;display:block}
    .eyebrow{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#918d87;margin-bottom:14px}
    h1{font-family:Georgia,serif;font-size:34px;line-height:1.15;margin:0 0 18px;font-weight:500}
    p{color:#aaa59d;line-height:1.7;font-size:14px;margin:0 auto 28px;max-width:520px}
    .note{font-size:12px;color:#6f6b66;border-top:1px solid #292929;padding-top:22px;margin-top:28px}
    a{color:#f5f4f1}
    .direct{display:inline-block;color:#fff;background:#e10600;text-decoration:none;padding:12px 20px;border-radius:5px;font-size:13px;font-weight:600}
    .pagelinks{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:#555}
    .pagelinks a{color:#777;text-decoration:none}
    iframe{border:0;width:100%;height:100vh;display:block}
    .join-mode .pagelinks{display:none}
  </style>
</head>
<body>
<script>
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzfKXPPE7ENMFG7yke16XWh03S98Q0u4JgkOAQ8VZ3uJfBVYUy4xeZxrWoAaV-Z26uQ/exec';
  const TOKEN = new URLSearchParams(window.location.search).get('token') || '';

  if (TOKEN) {
    document.body.className = 'join-mode';
    const iframe = document.createElement('iframe');
    iframe.src = WEBAPP_URL + '?page=join&token=' + encodeURIComponent(TOKEN);
    iframe.setAttribute('allow', 'geolocation');
    document.body.appendChild(iframe);
  } else {
    document.body.innerHTML = `
      <div class="wrap">
        <main class="card">
          <span class="logo">
            <img src="https://www.mcjoint.in/images/logos/MC%20Joint%20Logo-5-MC%20Joint%20Block%20Logo.png"
                 alt="MC"
                 onerror="this.parentElement.textContent='MC'">
          </span>
          <div class="eyebrow">MC Joint · Private Network</div>
          <h1>Aarti Badruka's Circle</h1>
          <p>
            A private contact network curated for Aarti Badruka's PR, events,
            collaborations and professional outreach.
          </p>
          <p class="note">
            This is an invitation-only network. If you received an invitation,
            please use the personal link shared with you.
          </p>
        </main>
      </div>
      <div class="pagelinks">
        <a href="./about.html">What is this?</a>
      </div>
    `;
  }
</script>
<noscript>
  <div class="wrap"><main class="card">
    <h1>Aarti Badruka's Circle</h1>
    <p>Please enable JavaScript to continue.</p>
  </main></div>
</noscript>
</body>
</html>
